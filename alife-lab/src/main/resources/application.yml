spring:
  main:
    banner-mode: off
logging:
  level:
    root: WARN

simulation:
  console: false
  grid-width: 80
  grid-height: 80
  total-iterations: 10000
  # В консольном режиме карта и статистика выводятся с этой периодичностью.
  print-every-n-steps: 100

  initial-plants: 1300
  initial-herbivores: 324
  initial-predators: 40

  plant-initial-energy: 5.05
  plant-energy-per-step: 2
  plant-energy-decay-per-step: 0
  plant-max-energy: 40
  # Порог и цена размножения подняты примерно вдвое относительно исходных
  # значений: одиночному растению теперь нужно вдвое больше шагов, чтобы
  # дать потомство. За несколько шагов кольцо травы вокруг только что
  # появившегося хищника уже не успевает сомкнуться - у него остаётся
  # время сдвинуться с места, пока свободные клетки ещё есть. Проверено
  # прогоном на 10000 шагов: популяции не взрываются и не вымирают быстрее,
  # чем на исходных параметрах, циклы хищник-жертва сохраняются.
  plant-reproduction-threshold: 13
  plant-reproduction-cost: 6.5


  herbivore-initial-energy: 24.6
  herbivore-energy-loss-per-step: 1.0
  herbivore-reproduction-threshold: 55
  herbivore-reproduction-cost: 18.07
  herbivore-vision-radius: 2
  herbivore-reproduction-cooldown-steps: 11

  predator-initial-energy: 35
  predator-energy-loss-per-step: 0.2
  predator-energy-from-herbivore: 40
  predator-reproduction-threshold: 40
  predator-reproduction-cost: 10
  predator-vision-radius: 2
  predator-reproduction-cooldown-steps: 15
